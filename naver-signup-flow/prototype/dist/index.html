<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>회원가입 개선 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; }
/* 레이아웃: 어두운 바탕 위 가운데 카드 1장, 카드 안은 머리(뒤로·진행) → 제목 → 본문 → 하단 버튼 */
:root {
  color-scheme: dark;

  /* 색상 (피그마 Color 변수와 같은 값) */
  --bg: #161616;
  --card: #1f1f1f;
  --surface: #2b2b2b;
  --surface-sel: #233322;
  --line-card: #333333;
  --line: #3a3a3a;
  --line-input: #4a4a4a;
  --fg: #ffffff;
  --fg-2: #b8b8b8;
  --fg-3: #8a8a8a;
  --fg-off: #666666;
  --brand: #67c664;
  --action: #5aa858;
  --action-off: #2e2e2e;
  --on-brand: #14200f;
  --error: #e5604d;
  --warn: #f2b84b;

  /* 글꼴 */
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;

  /* 모양 */
  --radius: 8px;
  --radius-lg: 12px;
  --radius-card: 20px;
}

html { background: var(--bg); }

[hidden] { display: none !important; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: 600px;
  margin: 0 auto;
  padding-block: 32px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 20px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding-inline: 4px;
}

.wordmark {
  font-size: 20px;
  font-weight: 700;
  color: var(--brand);
}

.proto-chip {
  font-size: 12px;
  color: var(--fg-2);
  border: 1px solid var(--line-input);
  border-radius: 999px;
  padding: 4px 10px;
}

/* 카드 */
.card {
  background: var(--card);
  border: 1px solid var(--line-card);
  border-radius: var(--radius-card);
  padding: 28px 40px 40px;
  min-height: 680px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.card-head { display: grid; gap: 12px; }

.card-title h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  line-height: 1.4;
  white-space: pre-line;
  text-wrap: balance;
}
.card-title h1:focus { outline: none; }
.card-title p {
  margin: 8px 0 0;
  font-size: 14px;
  line-height: 1.5;
  color: var(--fg-2);
}

.card-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-width: 0;
}

.card-foot { display: grid; gap: 10px; }

.card.center .card-title { text-align: center; }
.card.center .card-body { justify-content: center; }

.hint {
  margin: 0;
  text-align: center;
  font-size: 13px;
  color: var(--fg-3);
}

.proto-note {
  margin: 0;
  text-align: center;
  font-size: 12px;
  line-height: 1.7;
  color: var(--fg-3);
}
.proto-note b { color: var(--fg-2); }

/* 서버 연결 상태 */
.server-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-right: 10px;
}
.server-status::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--fg-off);
}
.server-status[data-online="true"]::before { background: var(--brand); }
.proto-note a.link { font-size: 12px; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

@media (max-width: 520px) {
  .page { padding-block: 20px 28px; }
  .card {
    padding: 20px 20px 24px;
    min-height: 0;
    border-radius: 16px;
  }
  .card-title h1 { font-size: 21px; }
}

/* ---------- 공통 ---------- */
.icon { display: inline-grid; flex: none; }
.icon svg { display: block; }

button { font-family: var(--font); }

:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}

.link {
  background: none;
  border: 0;
  padding: 4px 0;
  color: var(--fg-2);
  font-size: 13px;
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
  flex: none;
}
.link:hover { color: var(--fg); }

.icon-btn {
  display: grid;
  place-items: center;
  background: none;
  border: 0;
  padding: 6px;
  margin: -6px;
  color: var(--fg-2);
  border-radius: 50%;
  cursor: pointer;
}

/* ---------- 버튼 ---------- */
.btn {
  width: 100%;
  border: 0;
  border-radius: var(--radius);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: background-color 0.15s, transform 0.05s;
}
.btn-primary {
  height: 52px;
  background: var(--action);
  color: #fff;
}
.btn-primary:not(:disabled):hover { background: #63b561; }
.btn-primary:not(:disabled):active { transform: translateY(1px); background: #4f964d; }
.btn-primary:disabled {
  background: var(--action-off);
  color: var(--fg-off);
  cursor: not-allowed;
}
.btn-secondary {
  height: 48px;
  background: transparent;
  border: 1px solid var(--line-input);
  color: var(--fg-2);
  font-weight: 500;
}
.btn-secondary:hover { color: var(--fg); border-color: var(--fg-3); }

.back { width: 40px; height: 40px; margin: -8px 0 0 -10px; color: var(--fg); }

/* ---------- 진행 단계 ---------- */
.progress { display: grid; gap: 8px; }
.progress-bars {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.bar {
  height: 4px;
  border-radius: 2px;
  background: var(--line);
  transition: background-color 0.3s;
}
.bar.on { background: var(--brand); }
.progress-labels {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  font-size: 12px;
  color: var(--fg-3);
}
.progress-labels li { min-width: 0; }
.progress-labels .done { color: var(--brand); }
.progress-labels .now { color: var(--fg); font-weight: 700; }

/* ---------- 입력창 (밑줄형) ---------- */
.field { display: grid; gap: 6px; }
.field-label { font-size: 13px; color: var(--fg-3); }
.field-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 0 10px;
  border-bottom: 1px solid var(--line);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field-row:focus-within {
  border-bottom-color: var(--brand);
  box-shadow: 0 1px 0 var(--brand);
}
.field[data-status="error"] .field-row {
  border-bottom-color: var(--error);
  box-shadow: 0 1px 0 var(--error);
}
.field-prefix { font-size: 17px; color: var(--fg-2); flex: none; }

/* 국가 번호 선택: 보이는 건 '+82 ⌄', 실제 선택은 위에 투명하게 겹친 기본 목록 */
.country {
  position: relative;
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 0;
  margin-right: 2px;
  border-right: 1px solid var(--line);
  font-size: 17px;
  color: var(--fg-2);
  font-variant-numeric: tabular-nums;
}
.country-caret {
  width: 8px;
  height: 8px;
  margin-top: -4px;
  border-right: 1.6px solid currentColor;
  border-bottom: 1.6px solid currentColor;
  transform: rotate(45deg);
}
.country-native {
  position: absolute;
  inset: 0;
  width: 100%;
  opacity: 0;
  cursor: pointer;
  font-size: 16px;
}
.country:hover { color: var(--fg); }
.country:focus-within {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: 4px;
}
.field-input {
  flex: 1;
  min-width: 0;
  padding: 0;
  background: none;
  border: 0;
  outline: 0;
  color: var(--fg);
  font: 400 17px/1.5 var(--font);
  font-variant-numeric: tabular-nums;
}
.field-input::placeholder { color: var(--fg-off); }
.field-input:disabled { color: var(--fg-off); }
.field-status svg { width: 20px; height: 20px; }
.field-helper {
  margin: 0;
  font-size: 13px;
  line-height: 1.5;
  color: var(--fg-3);
}
.field[data-status="error"] .field-helper { color: var(--error); }
.field[data-status="success"] .field-helper { color: var(--brand); }

/* ---------- 약관 ---------- */
.all-agree {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  padding: 16px;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  color: var(--fg);
  cursor: pointer;
  transition: background-color 0.15s, border-color 0.15s;
}
.all-agree .icon { color: var(--fg-off); }
.all-agree[aria-checked="true"] { background: var(--surface-sel); border-color: var(--brand); }
.all-agree[aria-checked="true"] .icon { color: var(--brand); }
.all-text { display: grid; gap: 4px; min-width: 0; }
.all-title { font-size: 17px; font-weight: 700; }
.all-desc { font-size: 13px; line-height: 1.5; color: var(--fg-2); }

.group { display: grid; }
.group-label {
  margin: 0 0 2px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--fg-3);
}
.check-row { display: flex; align-items: center; gap: 12px; }
.check-row.sub { padding-left: 34px; }
.check-btn {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  background: none;
  border: 0;
  text-align: left;
  color: var(--fg);
  font-size: 15px;
  cursor: pointer;
}
.check-btn .icon { color: var(--fg-off); transition: color 0.15s; }
.check-btn[aria-checked="true"] .icon { color: var(--brand); }

.disclosure {
  font-size: 13px;
  color: var(--fg-2);
  border-top: 1px solid var(--line);
  padding-top: 14px;
}
.disclosure summary { cursor: pointer; font-weight: 500; }
.disclosure p { margin: 10px 0 0; line-height: 1.6; }

/* ---------- 선택 카드 · 세그먼트 ---------- */
.choices { display: grid; gap: 12px; }
.choice {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  padding: 16px;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line-input);
  border-radius: var(--radius-lg);
  color: var(--fg);
  cursor: pointer;
  transition: background-color 0.15s, border-color 0.15s;
}
.choice[aria-checked="true"] {
  background: var(--surface-sel);
  border-color: var(--brand);
  box-shadow: inset 0 0 0 0.5px var(--brand);
}
.radio {
  flex: none;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  margin-top: 1px;
  border: 2px solid var(--fg-off);
  border-radius: 50%;
}
[aria-checked="true"] > .radio { border-color: var(--brand); }
[aria-checked="true"] > .radio::after {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--brand);
}
.choice-text { display: grid; gap: 4px; min-width: 0; }
.choice-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 700;
}
.badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--brand);
  color: var(--on-brand);
}
.choice-desc { font-size: 13px; line-height: 1.55; color: var(--fg-2); }

.segments {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.seg {
  height: 52px;
  background: var(--surface);
  border: 1px solid var(--line-input);
  border-radius: var(--radius);
  color: var(--fg-2);
  font-size: 16px;
  cursor: pointer;
  transition: background-color 0.15s, border-color 0.15s, color 0.15s;
}
.seg[aria-checked="true"] {
  background: var(--surface-sel);
  border-color: var(--brand);
  box-shadow: inset 0 0 0 0.5px var(--brand);
  color: var(--brand);
  font-weight: 700;
}

/* ---------- 안내 박스 ---------- */
.notice {
  display: flex;
  gap: 8px;
  padding: 12px 14px;
  border-radius: var(--radius);
  background: var(--surface);
  font-size: 13px;
  line-height: 1.55;
  color: var(--fg-2);
}
.notice p { margin: 0; }
.notice .icon { margin-top: 1px; }
.notice-info .icon { color: var(--fg-3); }
.notice-warn .icon { color: var(--warn); }
.notice-error { box-shadow: inset 2px 0 0 var(--error); }
.notice-error .icon { color: var(--error); }

/* ---------- 이전 단계 요약 ---------- */
.summary { display: grid; }
.summary-item {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.summary-text { flex: 1; display: grid; gap: 2px; min-width: 0; }
.summary-label { font-size: 13px; color: var(--fg-3); }
.summary-value { font-size: 17px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* ---------- 인증 타이머 ---------- */
.timer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: var(--fg-2);
}
.timer-time { color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; }
.timer.expired .timer-time { color: var(--error); }
.stack { display: grid; gap: 10px; }
.stack:empty { display: none; }

/* ---------- 비밀번호 조건 ---------- */
.rules {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.rule {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  color: var(--fg-3);
  transition: color 0.15s;
}
.rule.met { color: var(--brand); }
.strength { margin: 0; font-size: 13px; color: var(--fg-3); }
.strength b { color: var(--fg-2); }
.strength b.good { color: var(--brand); }
.strength b.bad { color: var(--error); }

/* ---------- 그림 영역 ---------- */
.illus {
  display: grid;
  place-items: center;
  height: 180px;
  border-radius: var(--radius-lg);
  background: var(--surface);
  color: var(--brand);
}
.done-mark { display: grid; place-items: center; color: var(--brand); padding-block: 16px; }

/* ---------- 바텀시트 ---------- */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgb(0 0 0 / 0.6);
  animation: fade 0.2s ease-out;
}
.sheet {
  width: 100%;
  max-width: 560px;
  display: grid;
  gap: 16px;
  padding-top: 12px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  animation: rise 0.25s ease-out;
}
.sheet-handle {
  justify-self: center;
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: var(--line-input);
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-head h2 { margin: 0; font-size: 18px; }
.sheet-rows {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 10px 16px;
  margin: 0;
  font-size: 14px;
  line-height: 1.5;
}
.sheet-rows dt { font-weight: 700; color: var(--fg-2); }
.sheet-rows dd { margin: 0; }
.sheet-note { margin: 0; font-size: 12px; color: var(--fg-3); }

@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media (max-width: 520px) {
  .progress-labels { font-size: 11px; }
  .check-row.sub { padding-left: 24px; }
  .sheet-rows { grid-template-columns: 1fr; gap: 2px; }
  .sheet-rows dd { margin-bottom: 8px; }
}

</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <span class="wordmark">회원가입</span>
    <span class="proto-chip">UX 실습 프로토타입</span>
  </header>

  <main id="app" class="card" aria-live="polite"></main>

  <p class="proto-note">
    이름·생년월일·전화번호·비밀번호는 저장하지 않아요. 테스트 인증번호는 <b>123123</b>이에요.
    <button id="restart" type="button" class="link">처음부터 다시</button>
    <br>
    <span id="server-status" class="server-status">서버 확인 중…</span>
    <a id="stats-link" class="link" href="stats.html" hidden>측정 결과 보기</a>
  </p>
</div>
<script>
(function () {

// 입력한 값(이름, 번호 등)은 기록하지 않는다.

const VARIANT = 'after'; // 개선안. 개선 전 흐름을 재현하면 'before'로 기록한다

let sessionId = null;
let startedAt = 0;
let currentScreen = null;
let screenStartedAt = 0;
let queue = [];

const now = () => performance.now();
const newId = () =>
  (crypto.randomUUID ? crypto.randomUUID() : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 12)}`);

function flush() {
  if (!sessionId || !queue.length) return;
  if (status() === null) return; // 서버 확인 전이면 모아 두었다가 나중에 보낸다
  const events = queue;
  queue = [];
  sendEvents({ sessionId, variant: VARIANT, events });

function startSession() {

  sessionId = newId();
  startedAt = now();
  currentScreen = null;
  track('session_start');
}

  leaveScreen();
  currentScreen = screen;
  screenStartedAt = now();
  track('screen_view', { screen });
}

  if (!currentScreen) return;
  track('screen_leave', { screen: currentScreen, durationMs: now() - screenStartedAt });
  currentScreen = null;
}

/** 입력창에 빨간 오류가 뜰 때 (어떤 칸에서 어떤 오류가 많은지 보기 위해) */
function fieldError(label, message) {
  track('field_error', { screen: currentScreen, detail: `${label}: ${message}` });
}

/** 버튼을 눌렀는데 서버가 거절했을 때 (인증번호 불일치, 월 1회 초과 등) */

const getSessionId = () => sessionId;

function checkPasswordConfirm(password, confirm) {
  if (!confirm) return { ok: false, error: false, msg: '같은 비밀번호를 한 번 더 입력해 주세요.' };
