<svg width="420" height="457" viewBox="0 0 420 457" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="420" height="457" rx="16" fill="#F5F6F7"/>
<text fill="#03C75A" style="white-space: pre" xml:space="preserve" font-family="Pretendard" font-size="13" font-weight="600" letter-spacing="0em"><tspan x="28" y="42.1211">인지 부하 감소 원칙</tspan></text>
<text fill="#111111" style="white-space: pre" xml:space="preserve" font-family="Pretendard" font-size="22" font-weight="bold" letter-spacing="0em"><tspan x="28" y="88.8203">실명 / 비실명 아이디 차이를&#10;</tspan><tspan x="28" y="120.82">화면 안에서 바로 이해하게</tspan></text>
<g clip-path="url(#clip0_3_72)">
<text fill="#111111" style="white-space: pre" xml:space="preserve" font-family="Pretendard" font-size="16" font-weight="bold" letter-spacing="0em"><tspan x="28" y="164.188">1  비교 카드</tspan></text>
<text fill="#444444" style="white-space: pre" xml:space="preserve" font-family="Pretendard" font-size="14" letter-spacing="0em"><tspan x="28" y="188.977">두 유형의 가능(✓)·제한(✕)을 같은 형식으로 나란히 보여줘 검색 </tspan><tspan x="28" y="208.977">없이 비교 가능</tspan></text>
</g>
<g clip-path="url(#clip1_3_72)">
<text fill="#111111" style="white-space: pre" xml:space="preserve" font-family="Pretendard" font-size="16" font-weight="bold" letter-spacing="0em"><tspan x="28" y="249.188">2  상황별 추천 문구</tspan></text>
<text fill="#444444" style="white-space: pre" xml:space="preserve" font-family="Pretendard" font-size="14" letter-spacing="0em"><tspan x="28" y="273.977">“이런 분께” 한 줄로 내 상황에 맞는 선택을 바로 판단</tspan></text>
</g>
<g clip-path="url(#clip2_3_72)">
<text fill="#111111" style="white-space: pre" xml:space="preserve" font-family="Pretendard" font-size="16" font-weight="bold" letter-spacing="0em"><tspan x="28" y="314.188">3  선택을 이어받는 버튼</tspan></text>
<text fill="#444444" style="white-space: pre" xml:space="preserve" font-family="Pretendard" font-size="14" letter-spacing="0em"><tspan x="28" y="338.977">버튼에 선택한 유형을 그대로 표시하고 다음 단계로 진행 → 실명 여</tspan><tspan x="28" y="358.977">부를 두 번 묻지 않음</tspan></text>
</g>
<g clip-path="url(#clip3_3_72)">
<text fill="#111111" style="white-space: pre" xml:space="preserve" font-family="Pretendard" font-size="16" font-weight="bold" letter-spacing="0em"><tspan x="28" y="399.188">4  자세히 보기 링크</tspan></text>
<text fill="#444444" style="white-space: pre" xml:space="preserve" font-family="Pretendard" font-size="14" letter-spacing="0em"><tspan x="28" y="423.977">더 궁금한 사용자만 세부 서비스 목록을 열어보도록 정보 단계화</tspan></text>
</g>
